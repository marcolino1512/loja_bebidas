<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1020">
  <meta name="description" content="Simulador de máquina de venda de bebidas com cálculo de troco mínimo.">
  <title>Máquina de Bebidas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='8' y='3' width='16' height='26' rx='4' fill='%23e3242b'/><rect x='10' y='1' width='12' height='4' rx='2' fill='%23c3c8d3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <!-- Caminhos relativos: funcionam no Flask (raiz) e no GitHub Pages (subpasta) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">

  <!-- ================= MAQUINA ================= -->
  <section class="maquina" aria-label="Máquina de venda">
    <div class="topo">REFRESCO<span>·</span>EXPRESS</div>

    <div class="corpo">
      <!-- Vitrine: prateleiras geradas pelo app.js (tocar escolhe a bebida) -->
      <div class="vitrine" id="vitrine" aria-live="polite"></div>

      <!-- Painel de controle: visor, teclado e dinheiro -->
      <aside class="painel">
        <div class="lcd" id="lcd" role="status">
          <div class="lcd-l1" id="lcd1">ESCOLHA UMA BEBIDA</div>
          <div class="lcd-l2" id="lcd2">TOQUE OU DIGITE 1-5</div>
        </div>

        <div class="teclado" id="teclado" aria-label="Teclado">
          <button data-tecla="1">1</button><button data-tecla="2">2</button><button data-tecla="3">3</button>
          <button data-tecla="4">4</button><button data-tecla="5">5</button><button data-tecla="6">6</button>
          <button data-tecla="7">7</button><button data-tecla="8">8</button><button data-tecla="9">9</button>
          <button class="tecla-c" id="btn-cancelar" title="Cancelar e devolver">C</button>
        </div>

        <div class="inserido">
          <span>Inserido</span><strong id="inserido">R$ 0,00</strong>
        </div>

        <!-- Notas e moedas aceitas (geradas pelo app.js) -->
        <div class="dinheiro">
          <p class="rotulo">Notas</p>
          <div class="notas" id="notas"></div>
          <p class="rotulo">Moedas</p>
          <div class="moedas" id="moedas"></div>
        </div>
      </aside>
    </div>

    <!-- Saida da bebida e bandeja do troco -->
    <div class="saidas">
      <button class="push" id="push" disabled aria-label="Retirar bebida e troco">
        <span class="push-label">PUSH</span>
        <span class="bebida-saida" id="bebida-saida"></span>
      </button>
      <div class="bandeja" id="bandeja">
        <p class="rotulo">Troco</p>
        <div class="bandeja-itens" id="bandeja-itens"><em>vazio</em></div>
      </div>
    </div>
  </section>

  <!-- ================= OPERADOR ================= -->
  <section class="operador" aria-label="Painel do operador">
    <header>
      <h1>Painel do operador</h1>
      <button class="btn-sec" id="btn-reset">Restaurar estado inicial</button>
    </header>

    <div class="abas" role="tablist">
      <button class="aba ativa" data-aba="bebidas" role="tab">Bebidas</button>
      <button class="aba" data-aba="caixa" role="tab">Caixa</button>
      <button class="aba" data-aba="historico" role="tab">Histórico</button>
    </div>

    <div class="conteudo" id="aba-bebidas">
      <table>
        <thead><tr><th>ID</th><th>Produto</th><th>Valor</th><th>Estoque</th></tr></thead>
        <tbody id="tabela-bebidas"></tbody>
      </table>
    </div>

    <div class="conteudo oculto" id="aba-caixa">
      <p class="total-caixa">Total em caixa: <strong id="total-caixa"></strong></p>
      <div class="grade-caixa" id="grade-caixa"></div>
    </div>

    <div class="conteudo oculto" id="aba-historico">
      <ol class="historico" id="historico"></ol>
    </div>

    <!-- Comprovante da ultima compra -->
    <div class="recibo oculto" id="recibo"></div>
  </section>
</main>

<!-- maquina.js: regra de negocio usada quando nao ha servidor Python -->
<script src="maquina.js"></script>
<script src="app.js"></script>
</body>
</html>
